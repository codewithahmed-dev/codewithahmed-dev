name: Refresh 3D contribution city

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */12 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/render_isocalendar.py"
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  render-isometric-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render live blue 3D contribution city
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_isocalendar.py --username "${{ github.repository_owner }}"

      - name: Commit refreshed 3D contribution assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics-isocalendar-dark.svg assets/metrics-isocalendar-light.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh 3D contribution city"
          git push
