    <polygon points="260.0,153.0 385.5,244.2 337.6,391.8 182.4,391.8 134.5,244.2" fill="none" stroke="#B6DDF4" stroke-width="1.2" opacity="0.75" />
    <line x1="260" y1="285" x2="260.0" y2="153.0" stroke="#B6DDF4" stroke-width="1" opacity="0.7" />
    <line x1="260" y1="285" x2="385.5" y2="244.2" stroke="#B6DDF4" stroke-width="1" opacity="0.7" />
