<svg xmlns="http://www.w3.org/2000/svg" width="520" height="500" viewBox="0 0 520 500" role="img" aria-labelledby="title desc">
  <title id="title">Code Footprint</title>
  <desc id="desc">Live bytes across public repositories</desc>
  <defs>
    <linearGradient id="panelFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#F3FAFF" />
    </linearGradient>
    <radialGradient id="signalFill">
      <stop offset="0" stop-color="#0B74B8" stop-opacity="0.5" />
      <stop offset="1" stop-color="#158DD7" stop-opacity="0.18" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; }
    .title { fill: #061A2B; font-size: 25px; font-weight: 760; letter-spacing: 0.4px; }
    .subtitle { fill: #0B5E94; font-size: 13px; font-weight: 600; letter-spacing: 1px; }
    .axis-label { fill: #061A2B; font-size: 14px; font-weight: 700; }
    .axis-value { fill: #0B74B8; font-size: 12px; font-weight: 700; }
    .signal { filter: url(#glow); animation: pulse 3.6s ease-in-out infinite; transform-origin: 260px 285px; }
    @keyframes pulse { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }
  </style>
  <rect x="6" y="6" width="508" height="488" rx="24" fill="#9CCBE8" opacity="0.25" />
  <rect x="3" y="3" width="508" height="488" rx="24" fill="url(#panelFill)" stroke="#B6DDF4" stroke-width="1.5" />
  <path d="M28 82 H492" stroke="#B6DDF4" stroke-width="1" opacity="0.72" />
  <circle cx="31" cy="31" r="5" fill="#0B74B8" />
  <circle cx="48" cy="31" r="5" fill="#158DD7" opacity="0.75" />
  <text x="260" y="38" text-anchor="middle" class="title">Code Footprint</text>
  <text x="260" y="62" text-anchor="middle" class="subtitle">LIVE BYTES ACROSS PUBLIC REPOSITORIES</text>
