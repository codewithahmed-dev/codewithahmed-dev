    <circle cx="260.0" cy="153.0" r="5" fill="#0B74B8" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="346.5" cy="256.9" r="5" fill="#0B74B8" stroke="#FFFFFF" stroke-width="2" />
