<svg xmlns="http://www.w3.org/2000/svg" width="520" height="500" viewBox="0 0 520 500" role="img" aria-labelledby="title desc">
  <title id="title">Builder Radar</title>
  <desc id="desc">Self-rated build strengths</desc>
  <defs>
    <linearGradient id="panelFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08243A" />
      <stop offset="1" stop-color="#061A2B" />
    </linearGradient>
    <radialGradient id="signalFill">
      <stop offset="0" stop-color="#74D4FF" stop-opacity="0.5" />
      <stop offset="1" stop-color="#21A6F6" stop-opacity="0.18" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; }
    .title { fill: #F4FBFF; font-size: 25px; font-weight: 760; letter-spacing: 0.4px; }
    .subtitle { fill: #8AC9EE; font-size: 13px; font-weight: 600; letter-spacing: 1px; }
    .axis-label { fill: #F4FBFF; font-size: 14px; font-weight: 700; }
    .axis-value { fill: #74D4FF; font-size: 12px; font-weight: 700; }
    .signal { filter: url(#glow); animation: pulse 3.6s ease-in-out infinite; transform-origin: 260px 285px; }
    @keyframes pulse { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }
  </style>
  <rect x="6" y="6" width="508" height="488" rx="24" fill="#02101B" opacity="0.25" />
