<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Ahmed Nakhwa — Gotham developer command center</title>
  <desc id="desc">Dark Gotham-inspired animated profile banner for Ahmed Nakhwa, Incoming Data Analyst at Deloitte USI.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.55" stop-color="#11151b"/>
      <stop offset="1" stop-color="#020304"/>
    </linearGradient>
    <radialGradient id="signal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fde047" stop-opacity=".68"/>
      <stop offset=".55" stop-color="#e5b80b" stop-opacity=".24"/>
      <stop offset="1" stop-color="#e5b80b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yellow" x1="0" x2="1">
      <stop stop-color="#fff176"/>
      <stop offset="1" stop-color="#e5b80b"/>
    </linearGradient>
    <pattern id="rain" width="34" height="48" patternUnits="userSpaceOnUse" patternTransform="skewX(-12)">
      <path d="M8 0v20M25 25v13" stroke="#9ca3af" stroke-opacity=".12" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="22" fill="url(#night)"/>
  <rect width="1600" height="520" rx="22" fill="url(#rain)">
    <animate attributeName="opacity" values=".45;.8;.45" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <path d="M0 420L75 391L118 411L181 347L230 383L292 321L345 367L410 302L477 372L536 332L592 397L655 360L720 402V520H0Z" fill="#090c10"/>
  <path d="M820 520V340h95v180M930 520V286h126v234M1074 520V365h80v155M1172 520V316h120v204M1310 520V258h145v262M1468 520V350h132v170" fill="#080a0d" stroke="#20262e" stroke-width="3"/>
  <g fill="#fde047" opacity=".58">
    <path d="M954 324h12v8h-12zM991 324h12v8h-12zM1024 324h12v8h-12zM954 354h12v8h-12zM1024 354h12v8h-12z"/>
    <path d="M1200 350h12v8h-12zM1242 350h12v8h-12zM1200 386h12v8h-12zM1242 422h12v8h-12z"/>
    <path d="M1342 304h13v9h-13zM1382 304h13v9h-13zM1422 304h13v9h-13zM1342 344h13v9h-13zM1422 384h13v9h-13z"/>
  </g>

  <circle cx="1280" cy="142" r="154" fill="url(#signal)" filter="url(#glow)">
    <animate attributeName="opacity" values=".56;.92;.56" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="1280" cy="142" rx="91" ry="61" fill="#07090c" opacity=".9"/>
  <path d="M1192 142c28-5 47-20 62-45l26 24 26-24c15 25 34 40 62 45-27 7-45 23-58 47l-30-20-30 20c-13-24-31-40-58-47Z" fill="#fde047" opacity=".92" filter="url(#glow)">
    <animate attributeName="opacity" values=".72;1;.72" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="78" y="76" fill="#fde047" font-family="JetBrains Mono,Consolas,monospace" font-size="18" letter-spacing="5">BATCOMPUTER // PROFILE_001</text>
    <text x="74" y="173" fill="#f8fafc" font-size="72" font-weight="900" letter-spacing="3">AHMED NAKHWA</text>
    <rect x="78" y="203" width="10" height="48" rx="5" fill="url(#yellow)"/>
    <text x="111" y="238" fill="#f8fafc" font-size="29" font-weight="600" letter-spacing=".8">INCOMING DATA ANALYST AT DELOITTE USI</text>
    <text x="78" y="304" fill="#9ca3af" font-family="JetBrains Mono,Consolas,monospace" font-size="21" letter-spacing="4">CODE  •  DATA  •  CIRCUITS  •  IMPACT</text>
    <rect x="78" y="347" width="405" height="58" rx="7" fill="#fde047"/>
    <text x="105" y="384" fill="#080a0d" font-family="JetBrains Mono,Consolas,monospace" font-size="20" font-weight="800" letter-spacing="2">GOTHAM BUILD MODE: ON</text>
    <rect x="78" y="439" width="690" height="2" fill="#fde047" opacity=".75"/>
    <text x="78" y="476" fill="#c4c9d0" font-family="JetBrains Mono,Consolas,monospace" font-size="17" letter-spacing="2">BUILD IN SILENCE. SHIP WITH IMPACT.</text>
    <rect x="752" y="460" width="12" height="22" fill="#fde047">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity=".22" stroke="#67e8f9" stroke-width="1.5" fill="none">
    <rect x="900" y="86" width="208" height="112" rx="8"/>
    <path d="M922 120h88M922 142h143M922 164h118"/>
    <circle cx="1080" cy="112" r="7" fill="#67e8f9"/>
  </g>
</svg>
